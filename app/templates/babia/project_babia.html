<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>ScratchCity - Dr. Scratch</title>
  <meta name="description" content="Basic example for CodeCity component.">
  </meta>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
  <script src="../../static/app/scripts/dist/aframe-babia-components.js"></script>
  <script src="../../static/app/scripts/dist/stl.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.0.0/dist/aframe-environment-component.min.js"></script>
  <script src="https://unpkg.com/aframe-geometry-merger-component/dist/aframe-geometry-merger-component.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-html-shader@0.2.0/dist/aframe-html-shader.min.js"></script>
  <link rel="stylesheet" href="../../static/app/content/scratchblocks2.css">
  <script src="../../static/app/scripts/scratchblocks-v3.4-min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/jgbarah/aframe-stl-exporter-component@aframe-1.5.0/dist/aframe-stl-exporter-component.min.js"></script>
  <link src="./overlay.css" rel="stylesheet" />



  <script>

    var projectData = {{ babia_dict|safe }};

    window.onload = function() {
      scratchblocks.renderMatching('pre.blocks', {
        style: 'scratch3',   // Optional, defaults to 'scratch2'.
        languages: ['en'], // Optional, defaults to ['en'].
        scale: 1,                // Optional, defaults to 1
      });
    };
  </script>
</head>


<body>
  <div class="building_info" style="overflow: auto; display: flex; flex-direction: column;">
    
    <div style="border-bottom: 2px solid #ccc; padding-bottom: 10px; margin-bottom: 10px;">
        <h2 id="panel-title" style="margin: 0; color: #333;">Selecciona un elemento</h2>
        <span id="panel-subtitle" style="font-size: 0.9em; color: #666;">Haz clic en el suelo o en una torre</span>
    </div>

    <div id="view-district" style="display: none;">
        <p>Has seleccionado el Sprite (Distrito):</p>
        <h3 id="district-name-display" style="color: #3a85fc;">NombreSprite</h3>
        <p><strong>Scripts (Torres) contenidos:</strong></p>
        <ul id="district-scripts-list" style="padding-left: 20px;">
            </ul>
    </div>

    <div id="view-description" style="display: none;">
        <h3>Información del Script</h3>
        <p><strong>ID:</strong> <span id="script-id-display"></span></p>
        
        <div style="background: #eef; padding: 10px; border-radius: 5px; margin: 10px 0;">
            <strong>Descripción:</strong><br>
            <span id="ai-description-text">Aquí va la explicación del LLM.</span>
        </div>

        <button onclick="showCodeView()" class="button" style="background-color: #3a85fc; color: white; width: 100%; padding: 10px; cursor: pointer;">
            Ver Bloques de Código
        </button>
    </div>

    <div id="view-code" style="display: none; margin-top: 15px;">
        <hr>
        <pre id="script_blocks" class="blocks"></pre>
        
        <button onclick="hideCodeView()" class="button" style="background-color: #666; color: white; margin-top: 10px;">
            Ocultar Código
        </button>
    </div>

</div>

  
  
  <a-scene id="scene" background="color:  #c9f4f9" stl-exporter>

    <a-assets> 
      <div id="panelHtml" style="display: none;"> 
        <div class="building_info" style="width: 100px; height: 100px; overflow: auto;"> 
          <div class="container"> 
            <button id="export_btn" class="button">
              <span>Export as STL</span>
            </button> 
          </div> 
          <h1>Script Selected:</h1> 
          <pre id="script_blocks" class="blocks">Please, select a building.</pre> 
        </div> 
      </div> 
    </a-assets>
    -->

    <!--a-entity id="cityevolve" codecity='width: 60; depth: 50; algorithm: pivot;
    extra: 1.05; streets: true;
    base_thick: .1; streets_thick: .1;
    streets_width: 1; border: 1;
    absolute: true; quarter_elevation: .1;
    ' position="-0 0 -3"></a-entity-->
    <!-- Resto de tu escena -->
    <a-entity position="0 0 -3" babia-city='width: 10; depth: 10; streets: true; color: ccn;
        extra: 2; base_thick: 2; split: pivot; fmaxarea: area; fheight: Blocks;
        data: {{ babia_dict|safe }}' scale="2 0.1 2" titles: true></a-entity>


    <!-- Controls and Camera -->
    <a-entity movement-controls="fly: true" position="0 1.2 12">
      <a-entity camera position="0 3 4" look-controls></a-entity>
      <a-entity laser-controls raycaster="objects: .babiaxraycasterclass, #navbarpopup, #navbarpopup--close-icon, #iteractionpopup, #iteractionpopup--close-icon, 
          #cityinformation, #cityinformation--close-icon"></a-entity>
      <a-entity cursor="rayOrigin:mouse" raycaster="objects: .babiaxraycasterclass, #navbarpopup, #navbarpopup--close-icon, #iteractionpopup, #iteractionpopup--close-icon, 
          #cityinformation, #cityinformation--close-icon"></a-entity>
      <!--<a-entity id="leftHand" oculus-touch-controls="hand: left"> <a-plane id="panel" width="1" height="0.5" position="0 0 -1" rotation="0 0 0" color="blue" material="shader: html; target: #panelHtml; fps: 30;"> </a-plane> </a-entity>-->
    </a-entity>

  </a-scene>
  <style>
    .gitlab-corner-wrapper {
      overflow: hidden;
      width: 100px;
      height: 100px;
      position: absolute;
      top: 0;
      right: 0
    }

    .gitlab-corner {
      position: absolute;
      top: -16px;
      right: -50px;
      transform: rotate(45deg);
      background: #548;
      border: 44px solid #548;
      border-bottom: none;
      border-top: #548 solid 16px
    }

    .gitlab-corner svg {
      width: 60px;
      height: 60px;
      margin-bottom: -4px
    }

    .cls-1 {
      fill: #fc6d26
    }

    .cls-2 {
      fill: #e24329
    }

    .cls-3 {
      fill: #fca326
    }

    .gitlab-corner:hover .cls-1 {
      animation: cycle .6s
    }

    .gitlab-corner:hover .cls-2 {
      animation: cycleMid .6s
    }

    .gitlab-corner:hover .cls-3 {
      animation: cycleEnd .6s
    }

    @keyframes cycle {

      100%,
      15%,
      60% {
        fill: #fc6d26
      }

      30%,
      75% {
        fill: #e24329
      }

      45%,
      90% {
        fill: #fca326
      }
    }

    @keyframes cycleMid {

      100%,
      15%,
      60% {
        fill: #e24329
      }

      30%,
      75% {
        fill: #fca326
      }

      45%,
      90% {
        fill: #fc6d26
      }
    }

    @keyframes cycleEnd {

      100%,
      15%,
      60% {
        fill: #fca326
      }

      30%,
      75% {
        fill: #fc6d26
      }

      45%,
      90% {
        fill: #e24329
      }
    }

    .building_info {
      position: fixed; 
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      margin-right: 0.8%;
      z-index: 9999;
      width: 30%;
      height: 95%;
      background-color: white;
      border: 1px solid black;
      padding: 10px; 
    }
  </style>

  <script>
    // --- DATOS DEL PROYECTO ---
    // (Asegúrate de que esta línea esté al principio o aquí mismo)
    // var projectData = {{ babia_dict|safe }}; // Ya la tienes arriba, no hace falta repetirla si es global

    // Referencias al DOM
    const views = {
        district: document.getElementById('view-district'),
        description: document.getElementById('view-description'),
        code: document.getElementById('view-code')
    };
    
    const ui = {
        title: document.getElementById('panel-title'),
        subtitle: document.getElementById('panel-subtitle'),
        districtName: document.getElementById('district-name-display'),
        scriptList: document.getElementById('district-scripts-list'),
        scriptId: document.getElementById('script-id-display'),
        codeBlock: document.getElementById('script_blocks')
    };

    let currentRawCode = ""; 

    function hideAllViews() {
        views.district.style.display = 'none';
        views.description.style.display = 'none';
        views.code.style.display = 'none';
    }

    window.showCodeView = function() {
        views.code.style.display = 'block';
        if (currentRawCode) {
            ui.codeBlock.innerHTML = ""; 
            ui.codeBlock.innerText = currentRawCode; 
        }
        scratchblocks.renderMatching('#script_blocks', { style: 'scratch3', scale: 0.7 });
    };

    window.hideCodeView = function() {
        views.code.style.display = 'none';
    };

    // --- LISTENER SUPER ROBUSTO ---
    document.querySelector('a-scene').addEventListener('click', function (evt) {
        
        let intersection = evt.detail.intersectedEl;
        if (!intersection) return;

        // Buscamos qué es lo que hemos clicado comparando IDs con nuestro JSON
        let context = findContextByElementID(intersection);

        if (context) {
            if (context.type === 'district') {
                // Limpiamos el bloque de código para evitar confusiones futuras
                ui.codeBlock.innerText = "";
                currentRawCode = "";
                showDistrictView(context.data);
            } 
            else if (context.type === 'tower') {
                // Es una torre
                handleTowerData(context.data, context.parent);
            }
        } else {
            // Si no encontramos nada por ID, intentamos el fallback antiguo (por si acaso)
            // pero solo si es la primera vez o estamos seguros
            console.log("No se identificó el objeto por ID. Elemento clicado:", intersection);
        }
    });

    // Función "Sabueso": Busca el ID del elemento 3D en nuestros datos
    function findContextByElementID(element) {
        let el = element;
        let depth = 0;
        
        // Subimos hasta 7 niveles por si el clic fue en un hijo del objeto
        while (el && depth < 7) { 
            let checkId = el.id;
            
            if (checkId) {
                // Normalizamos IDs (Babia a veces cambia espacios por guiones bajos)
                let variants = [
                    checkId,
                    checkId.replace(/_/g, ' '),
                    checkId.replace(/ /g, '_')
                ];

                // Buscamos en todos los distritos
                for (let district of projectData.children) {
                    
                    // 1. ¿Es un Distrito?
                    if (variants.includes(district.id)) {
                        return { type: 'district', data: district };
                    }
                    
                    // 2. ¿Es una Torre dentro de este distrito?
                    for (let script of district.children) {
                        if (variants.includes(script.id)) {
                            return { type: 'tower', data: script, parent: district };
                        }
                    }
                }
            }
            el = el.parentNode;
            depth++;
        }
        return null; // No encontramos nada conocido
    }

    function showDistrictView(districtData) {
        hideAllViews();
        
        ui.title.innerText = "Distrito (Sprite)";
        ui.subtitle.innerText = "Vista general del objeto";
        ui.districtName.innerText = districtData.id;
        ui.scriptList.innerHTML = "";
        
        if (districtData.children && districtData.children.length > 0) {
            districtData.children.forEach(script => {
                let li = document.createElement('li');
                li.innerText = script.id + " (" + script.Blocks + " bloques)";
                li.style.cursor = "pointer";
                li.style.color = "#3a85fc";
                li.style.textDecoration = "underline";
                li.style.marginBottom = "5px";
                li.onclick = function() {
                    handleTowerData(script, districtData);
                };
                ui.scriptList.appendChild(li);
            });
        } else {
            ui.scriptList.innerHTML = "<li>Este Sprite no tiene scripts.</li>";
        }
        views.district.style.display = 'block';
    }

    // Nueva función simplificada que recibe los datos directamente
    function handleTowerData(scriptData, parentDistrict) {
        hideAllViews();
        
        // Guardamos el código
        currentRawCode = scriptData.script_blocks;
        ui.codeBlock.innerText = currentRawCode; // Preparamos el hidden div

        // Actualizamos UI
        ui.title.innerText = "Script Seleccionado";
        ui.subtitle.innerText = "Torre de código";
        ui.scriptId.innerText = scriptData.id;
        
        // Botón volver
        let descContainer = document.getElementById('view-description');
        let oldBtn = document.getElementById('btn-back-district');
        if(oldBtn) oldBtn.remove();

        let backBtn = document.createElement('button');
        backBtn.id = 'btn-back-district';
        backBtn.className = 'button';
        backBtn.innerText = "Volver al Sprite " + parentDistrict.id;
        backBtn.style.background = "#ddd";
        backBtn.style.color = "#333";
        backBtn.style.width = "100%";
        backBtn.style.marginBottom = "10px";
        backBtn.onclick = function() { showDistrictView(parentDistrict); };
        
        descContainer.insertBefore(backBtn, descContainer.firstChild);

        views.description.style.display = 'block';
    }
  </script>

</body>

</html>
